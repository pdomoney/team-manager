name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'site/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Structured browser release qualification (simulated GitHub, synthetic data)
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          # Capacity uses 100 synthetic player photos and is heavier than normal
          # smoke checks. Qualify it on pull requests, not on every main push.
          if [ "${{ github.event_name }}" != "pull_request" ]; then extra+=(--skip-capacity); fi
          python3 test/browser/run_all.py --skip-unit --out qualification.json "${extra[@]}"
      - name: Preserve browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification-${{ github.sha }}
          path: qualification.json
          if-no-files-found: warn
          retention-days: 14
