name: Tests

on:
  pull_request:
  push:
    branches: [main, 'candidate/**']
    paths: ['src/**', 'test/**', 'site/**', 'worker/**', 'supabase/**', 'wrangler.jsonc', 'scripts/check-first-team-cloud-release.mjs', 'scripts/release/**', 'config/first-team-cloud-release-evidence.json']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release diagnostics and generated browser code without provider access
        working-directory: scripts/release
        run: |
          python3 -B -m unittest -v
          node test_browser_generated.mjs
      - run: npm test
      - name: Confirm first-team cloud release ledger remains safely blocked
        run: node scripts/check-first-team-cloud-release.mjs --assert-source-blocked

  stage1-postgres:
    # No Supabase API keys, linked project or live participant records.
    # Each CI run receives a fresh disposable PostgreSQL service.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stage1-ci-synthetic-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: stage1-ci-synthetic-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if not present
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Rehearse versioned schema and isolated cross-client transactions
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            supabase/tests/stage1_bootstrap_disposable.sql \
            supabase/migrations/20261118010000_first_team_private_foundation.sql \
            supabase/migrations/20261118020000_first_team_my_context.sql \
            supabase/migrations/20261118030000_stage1_team_operations.sql \
            supabase/tests/first_team_private_foundation.sql \
            supabase/tests/first_team_my_context.sql \
            supabase/tests/stage1_persistent_journey.sql \
            supabase/migrations/20261119010000_stage2_operator_context.sql \
            supabase/migrations/20261119020000_stage2_play_revisions.sql \
            supabase/tests/stage2_persistent_journey.sql \
            supabase/migrations/20261119030000_stage3a_minimal_account_profiles.sql \
            supabase/tests/stage3a_minimal_account_profiles.sql \
            supabase/migrations/20261119040000_stage3a_onboarding.sql \
            supabase/tests/stage3a_onboarding_journey.sql \
            supabase/migrations/20261119050000_stage3b_management.sql \
            supabase/tests/stage3b_management_journey.sql \
            supabase/tests/stage3c_bootstrap_disposable.sql \
            supabase/tests/stage3d_first_live_team_disposable.sql \
            supabase/migrations/20261120010000_stage3d3_registration_policy.sql \
            supabase/tests/stage3d3_registration_policy_disposable.sql \
            supabase/migrations/20261120020000_stage3d3_direct_rpc_registration_gate.sql \
            supabase/tests/stage3d3_direct_rpc_registration_disposable.sql \
            supabase/migrations/20261121010000_stage3d4_founder_admin.sql \
            supabase/tests/stage3d4_founder_admin_disposable.sql \
            supabase/migrations/20261123010000_stage3d5_functional_completion.sql \
            supabase/migrations/20261123010100_stage3d5_team_rpc.sql \
            supabase/migrations/20261124010000_stage3d5_shared_coach_messaging.sql \
            supabase/migrations/20261124020000_stage3d5_phase1_fixture_read.sql \
            supabase/migrations/20261124030000_stage3d5_phase1_player_view.sql \
            supabase/migrations/20261124040000_stage3d5_phase1_operational_completion.sql \
            supabase/migrations/20261124050000_stage3d5_verified_management_authority.sql \
            supabase/migrations/20261124060000_stage3d5_match_selection.sql \
            supabase/migrations/20261126010000_stage3d5_communications_lifecycle.sql \
            supabase/migrations/20261126020000_stage3d5_branding.sql \
            supabase/migrations/20261126030000_stage3d5_branding_moderation.sql \
            supabase/migrations/20261126040000_stage3d5_matchday_arrivals.sql \
            supabase/migrations/20261126050000_stage3d5_matchday_records.sql \
            supabase/migrations/20261127010000_stage4_play_assignments.sql \
            supabase/tests/stage3d5_functional_completion_disposable.sql \
            supabase/tests/stage4_play_assignments_disposable.sql
          do
            echo "Stage 1 isolated PostgreSQL: $script"
            psql -X -v ON_ERROR_STOP=1 -f "$script"
            case "$script" in
              *20261121010000*|*20261123010100*|*20261124010000*|*20261124020000*|*20261124030000*|*20261124040000*|*20261124050000*|*20261124060000*|*20261126010000*|*20261126020000*|*20261126030000*)
                echo "Schema definition comparison checkpoint: $script"
                psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage3d5_schema_fingerprints.sql
                ;;
            esac
          done

  browser:
    # Playwright 1.55.0 needs its Ubuntu 24.04 browser dependencies.
    # Match the version-pinned WebKit job: prebuilt browsers/libraries avoid
    # slow/flaky apt mirrors, without skipping any Chromium checks.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install version-matched Python Playwright client
        run: python -m pip install playwright==1.55.0
      - name: Stage 3D.5 unified management team chips on Chromium
        env:
          STAGE3D5_BROWSER_ENGINE: chromium
        run: python3 test/browser/stage3d5_team_chips.py
      - name: Structured browser release qualification (simulated GitHub, synthetic data)
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          # Capacity uses 100 synthetic player photos and is heavier than normal
          # smoke checks. Qualify it on pull requests, not on every main push.
          if [ "${{ github.event_name }}" != "pull_request" ]; then extra+=(--skip-capacity); fi
          python3 test/browser/run_all.py --skip-unit --out qualification.json "${extra[@]}"
      - name: Stage 3D.3 adult policy registration on Chromium
        env:
          STAGE3D3_BROWSER_ENGINE: chromium
        run: python3 test/browser/stage3d3_registration.py
      - name: Stage 3D.4 founder policy readiness and responsive layout on Chromium
        env:
          STAGE3D4_BROWSER_ENGINE: chromium
        run: python3 test/browser/stage3d4_readiness.py
      - name: Stage 3D.4B invited adult claim before policy on Chromium
        env:
          STAGE3D4B_BROWSER_ENGINE: chromium
        run: python3 test/browser/stage3d4b_invitation_claim.py
      - name: Preserve connected presentation review (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-presentation-chromium-${{ github.sha }}
          path: presentation-review/chromium/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification-${{ github.sha }}
          path: qualification.json
          if-no-files-found: warn
          retention-days: 14

  browser-webkit:
    # Targeted B5 cross-engine check. Linux WebKit catches engine-specific
    # behaviour but does NOT substitute for iPhone/macOS Safari or owner UX.
    # Use Playwright's version-matched image to avoid slow/flaky Ubuntu apt
    # mirror downloads during --with-deps (PR #264 WebKit CI was cancelled
    # after 20 minutes before reaching any browser tests).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install version-matched Python Playwright client
        run: python -m pip install playwright==1.55.0
      - name: Stage 3D.5 unified management team chips on WebKit
        env:
          STAGE3D5_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3d5_team_chips.py
      - name: B5 full play journey on WebKit (synthetic data, no installation)
        env:
          B5_BROWSER_ENGINE: webkit
        run: python3 test/browser/play_b5_cross_device.py
      - name: E4.12 connected-path precision and touch input on WebKit
        env:
          E412_GESTURE_ENGINE: webkit
        run: |
          python3 test/browser/play_e4_drag_intent.py
          python3 test/browser/play_e4_touch_input.py
      - name: Stage 2 signed-in team journeys on WebKit
        env:
          STAGE2_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage2_cloud.py
      - name: Stage 3A account invitations and recovery on WebKit
        env:
          STAGE3A_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3a_onboarding.py
      - name: Stage 3B shared management journeys on WebKit
        env:
          STAGE3B_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3b_management.py
      - name: Stage 3C isolated management staging on WebKit
        env:
          STAGE3C_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3c_staging.py
      - name: Stage 3D.2 provider and email login on WebKit
        env:
          STAGE3D2_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3d2_login.py
      - name: Stage 3D.3 adult policy registration on WebKit
        env:
          STAGE3D3_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3d3_registration.py
      - name: Stage 3D.4 founder policy readiness and responsive layout on WebKit
        env:
          STAGE3D4_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3d4_readiness.py
      - name: Stage 3D.4B invited adult claim before policy on WebKit
        env:
          STAGE3D4B_BROWSER_ENGINE: webkit
        run: python3 test/browser/stage3d4b_invitation_claim.py
      - name: Preserve connected presentation review on WebKit (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-presentation-webkit-${{ github.sha }}
          path: presentation-review/webkit/
          if-no-files-found: warn
          retention-days: 14
