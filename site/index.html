<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123D2B">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Team">
  <title>Team Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="team-title">Team Manager</h1>
      <span class="days-chip" id="days-chip" hidden></span>
      <button class="icon-btn bell" id="bell-btn" data-act="updates" aria-label="Updates" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge"></span></button>
      <button class="icon-btn" id="menu-btn" data-act="settings" aria-label="Settings" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <div class="status" id="status" role="status" hidden></div>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading" role="status">Loading the team…</p>
    <noscript><p class="loading">This app needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>

  <div class="sheet" id="sheet" hidden></div>
  <div class="ask" id="ask" role="region" aria-label="Was the message sent?" aria-live="polite" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" data-change="import-file" hidden>
</body>
</html>
