<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123D2B">
  <meta name="robots" content="noindex,nofollow">
  <title>My team | Team Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cloud-team.css">
  <script type="module" src="cloud-team.js"></script>
</head>
<body class="cloud-team-page">
  <header class="top cloud-team-header">
    <div class="top-row">
      <span class="t-crest" aria-hidden="true"><span id="cloud-crest" class="crest all">TM</span></span>
      <div class="cloud-team-heading"><h1 id="cloud-team-title">Team Manager</h1><p id="active-context">Checking your access…</p></div>
      <button type="button" class="icon-btn" id="cloud-notices-shortcut" aria-label="Open team updates" hidden></button>
      <button type="button" class="icon-btn" id="cloud-settings-shortcut" aria-label="Open team preferences" hidden></button>
      <a class="cloud-team-back" href="cloud-access.html">Account</a>
    </div>
  </header>
  <div class="cloud-workspace-layout">
    <nav class="cloud-desktop-nav" id="cloud-desktop-nav" aria-label="Management sections" hidden></nav>
    <div class="cloud-content">
      <div class="scope cloud-context-controls" id="context-controls" hidden>
        <nav id="club-chips" class="scope-row cloud-chips" aria-label="Your authorised clubs and platform"></nav>
        <nav id="team-chips" class="scope-row teams cloud-chips cloud-team-chips" aria-label="Your authorised teams"></nav>
      </div>
      <main class="cloud-main" id="cloud-main">
        <p role="status">Verifying your account and team permissions…</p>
      </main>
    </div>
  </div>
  <nav class="cloud-nav tabs" id="cloud-nav" aria-label="Sections" hidden></nav>
  <p class="cloud-alert" id="cloud-alert" aria-live="polite" role="status" hidden></p>
</body>
</html>
